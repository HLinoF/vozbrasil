spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vozbrasil}
    username: ${DB_USER:vozbrasil}
    password: ${DB_PASSWORD:vozbrasil-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-request-size: 256KB
server:
  port: ${PORT:8080}
  error:
    include-message: never
  tomcat:
    max-http-form-post-size: 256KB
  servlet:
    session:
      cookie:
        http-only: true
app:
  origin: ${APP_ORIGIN:http://localhost:3000}
  secret: ${APP_SECRET:}
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  secure-cookie: ${SECURE_COOKIE:false}
  retention-days: ${RETENTION_DAYS:730}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
